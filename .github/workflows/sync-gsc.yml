name: GSC Weekly Sync & AI Analysis

on:
  schedule:
    # Weekly on Mondays at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  sync-gsc:
    name: Sync Google Search Console & Run AI Analysis
    runs-on: ubuntu-latest

    env:
      GSC_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GSC_SERVICE_ACCOUNT_EMAIL }}
      GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      GSC_COMPANY_ID: ${{ secrets.GSC_COMPANY_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Search Console sync
        run: node scripts/sync-search-console.mjs

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.BACKUP_EMAIL }}
          password: ${{ secrets.BACKUP_EMAIL_PASSWORD }}
          subject: "✅ GSC sync & AI analysis completed — pumbapood.ee"
          body: "Search Console sync completed successfully. Recommendations are available in the Ads Control Panel."
          to: ${{ secrets.BACKUP_EMAIL }}
          from: ${{ secrets.BACKUP_EMAIL }}

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.BACKUP_EMAIL }}
          password: ${{ secrets.BACKUP_EMAIL_PASSWORD }}
          subject: "❌ GSC sync failed — pumbapood.ee"
          body: "Search Console sync failed! Check GitHub Actions log for details."
          to: ${{ secrets.BACKUP_EMAIL }}
          from: ${{ secrets.BACKUP_EMAIL }}
