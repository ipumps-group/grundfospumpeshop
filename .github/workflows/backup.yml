name: Database & Storage Backup

on:
  schedule:
    # Andmebaas: iga päev kell 03:00 UTC
    - cron: '0 3 * * *'
    # Pildid: iga esmaspäev kell 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  backup-database:
    name: Backup Supabase Database
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_EMAIL: ${{ secrets.BACKUP_EMAIL }}
          BACKUP_EMAIL_PASSWORD: ${{ secrets.BACKUP_EMAIL_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Secret SUPABASE_DB_URL is not set or empty. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${BACKUP_EMAIL:-}" ]; then
            echo "::error::Secret BACKUP_EMAIL is not set or empty. Required for success/failure notifications."
            exit 1
          fi
          if [ -z "${BACKUP_EMAIL_PASSWORD:-}" ]; then
            echo "::error::Secret BACKUP_EMAIL_PASSWORD is not set or empty. Required for success/failure notifications."
            exit 1
          fi
          echo "✅ Required secrets are configured."

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p backups

          # Supabase nõuab krüpteeritud ühendust; veendu, et sslmode=require oleks määratud.
          DB_URL="$DATABASE_URL"
          if [[ "$DB_URL" != *"sslmode="* ]]; then
            if [[ "$DB_URL" == *"?"* ]]; then
              DB_URL="${DB_URL}&sslmode=require"
            else
              DB_URL="${DB_URL}?sslmode=require"
            fi
          fi

          echo "Testing database connection..."
          psql "$DB_URL" -c "SELECT version();" -q -t
          echo "✅ Database connection OK."

          echo "Running pg_dump..."
          pg_dump "$DB_URL" \
            --no-owner \
            --no-acl \
            --format=plain \
            --file=backups/db_$(date +%Y%m%d_%H%M%S).sql
          echo "✅ pg_dump completed."

      - name: Compress backup
        if: success()
        run: gzip backups/*.sql

      - name: Upload to GitHub Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: backups/
          retention-days: 30

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.BACKUP_EMAIL }}
          password: ${{ secrets.BACKUP_EMAIL_PASSWORD }}
          subject: "✅ ipumps.ee DB backup õnnestus - ${{ github.run_number }}"
          body: "Andmebaasi backup on salvestatud. Kuupäev: $(date +%Y-%m-%d)"
          to: ${{ secrets.BACKUP_EMAIL }}
          from: ${{ secrets.BACKUP_EMAIL }}

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.BACKUP_EMAIL }}
          password: ${{ secrets.BACKUP_EMAIL_PASSWORD }}
          subject: "❌ ipumps.ee DB backup EBAÕNNESTUS - ${{ github.run_number }}"
          body: "Andmebaasi backup ebaõnnestus! Kontrolli GitHub Actions logi."
          to: ${{ secrets.BACKUP_EMAIL }}
          from: ${{ secrets.BACKUP_EMAIL }}

  backup-images:
    name: Backup Supabase Storage Images
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 4 * * 1' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Validate required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_EMAIL: ${{ secrets.BACKUP_EMAIL }}
          BACKUP_EMAIL_PASSWORD: ${{ secrets.BACKUP_EMAIL_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::Secret SUPABASE_URL is not set or empty."
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Secret SUPABASE_SERVICE_ROLE_KEY is not set or empty."
            exit 1
          fi
          if [ -z "${BACKUP_EMAIL:-}" ]; then
            echo "::error::Secret BACKUP_EMAIL is not set or empty. Required for success/failure notifications."
            exit 1
          fi
          if [ -z "${BACKUP_EMAIL_PASSWORD:-}" ]; then
            echo "::error::Secret BACKUP_EMAIL_PASSWORD is not set or empty. Required for success/failure notifications."
            exit 1
          fi
          echo "✅ Required secrets are configured."

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download images from Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p images

          echo "Listing objects in Supabase Storage bucket 'products'..."
          curl -sS -f "${SUPABASE_URL}/storage/v1/object/list/products" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"prefix": "", "limit": 1000}' \
            > /tmp/storage-list.json

          COUNT=$(jq 'length' /tmp/storage-list.json)
          echo "Found $COUNT objects to download."

          jq -r '.[].name' /tmp/storage-list.json | while read -r file; do
            mkdir -p "images/$(dirname "$file")"
            echo "Downloading: $file"
            curl -sS -f -o "images/$file" \
              "${SUPABASE_URL}/storage/v1/object/products/$file" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
          done

      - name: Compress images
        if: success()
        run: tar -czf images_$(date +%Y%m%d).tar.gz images/

      - name: Upload to GitHub Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: images-backup-${{ github.run_number }}
          path: images_*.tar.gz
          retention-days: 30

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.BACKUP_EMAIL }}
          password: ${{ secrets.BACKUP_EMAIL_PASSWORD }}
          subject: "✅ ipumps.ee piltide backup õnnestus"
          body: "Piltide backup GitHub Artifacts'i õnnestus. Kuupäev: $(date +%Y-%m-%d)"
          to: ${{ secrets.BACKUP_EMAIL }}
          from: ${{ secrets.BACKUP_EMAIL }}

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.BACKUP_EMAIL }}
          password: ${{ secrets.BACKUP_EMAIL_PASSWORD }}
          subject: "❌ ipumps.ee piltide backup EBAÕNNESTUS"
          body: "Piltide backup ebaõnnestus! Kontrolli GitHub Actions logi."
          to: ${{ secrets.BACKUP_EMAIL }}
          from: ${{ secrets.BACKUP_EMAIL }}
